<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube for Onshape</title>
  </head>
  <body>
    <header>
      <form id="form">
        <input id="q" type="text" placeholder="Paste a YouTube link…" autocomplete="off" />
        <button type="submit">Go</button>
      </form>
    </header>
    <main>
      <div id="player-wrap" hidden><iframe id="player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
      <p id="msg"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
